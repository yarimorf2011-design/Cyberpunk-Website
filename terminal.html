<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE BREAKER - Terminal</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Custom Terminal Overrides - GREEN THEME */
        .terminal-container {
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            border: 2px solid #33ff33;
            background: rgba(0, 10, 0, 0.85);
            box-shadow: 0 0 30px rgba(51, 255, 51, 0.2);
            position: relative;
            z-index: 10;
            transition: all 0.3s;
        }

        .terminal-header {
            background: rgba(51, 255, 51, 0.15);
            color: #33ff33;
            padding: 15px 20px;
            border-bottom: 2px solid #33ff33;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
            transition: all 0.3s;
        }

        .editor-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow: hidden; 
        }

        #code-editor {
            flex: 3 1 0%; 
            min-height: 0; 
            background: #010501;
            border: 1px solid rgba(51, 255, 51, 0.3);
            color: #33ff33; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            padding: 20px;
            outline: none;
            resize: none;
            line-height: 1.5;
            transition: all 0.3s;
        }

        #code-editor:focus {
            border-color: #33ff33;
            box-shadow: inset 0 0 20px rgba(51, 255, 51, 0.1);
        }

        #terminal-output {
            flex: 2 1 0%; 
            min-height: 0; 
            background: #000000;
            border: 1px solid rgba(51, 255, 51, 0.3);
            color: #ffffff; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            padding: 15px;
            overflow-y: auto;
            line-height: 1.4;
            transition: all 0.3s;
        }

        #code-editor::-webkit-scrollbar, #terminal-output::-webkit-scrollbar { width: 8px; }
        #code-editor::-webkit-scrollbar-track, #terminal-output::-webkit-scrollbar-track { background: transparent; }
        #code-editor::-webkit-scrollbar-thumb, #terminal-output::-webkit-scrollbar-thumb { background: #33ff33; }

        .terminal-controls {
            display: flex;
            justify-content: space-between;
            flex-shrink: 0; 
        }

        .action-btn {
            padding: 10px 30px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.2s;
        }

        .return-btn { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); }
        .return-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

        .exec-btn { background: rgba(51, 255, 51, 0.1); border: 1px solid #33ff33; color: #33ff33; }
        .exec-btn:hover { background: #33ff33; color: #000; box-shadow: 0 0 15px #33ff33; }

        /* Modals */
        .target-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #050a05; border: 2px solid #33ff33; padding: 20px;
            box-shadow: 0 0 30px rgba(51, 255, 51, 0.5); z-index: 100;
            display: flex; flex-direction: column; gap: 15px; text-align: center;
            transition: all 0.3s;
        }
        
        .spoof-theme {
            background: #0a0000;
            border-color: #ff2a2a !important;
            box-shadow: 0 0 30px rgba(255, 42, 42, 0.5) !important;
            width: 400px;
        }

        .spoof-input {
            background: rgba(255, 42, 42, 0.05);
            border: 1px solid #ff2a2a;
            color: #ff2a2a;
            padding: 10px;
            font-family: monospace;
            outline: none;
            width: 100%;
        }
        
        .spoof-input::placeholder { color: rgba(255, 42, 42, 0.5); }
        .spoof-textarea { resize: none; height: 100px; }
        
        .ghost-window {
            position: fixed; border: 1px solid #33ff33; background: rgba(0,20,0,0.9);
            color: #33ff33; font-family: monospace; padding: 10px; z-index: 9999;
            box-shadow: 0 0 15px #33ff33; pointer-events: none;
        }

        /* =========================================
           --- INTENSE BLACKWALL VISUALS ---
           ========================================= */
        .blackwall-overlay {
            display: none;
            position: fixed;
            top: 50%;
            left: 0;
            width: 100vw;
            height: 4px;
            background: #ff0000;
            box-shadow: 0 0 80px 40px rgba(255, 0, 0, 0.8), 0 0 150px 80px rgba(255, 0, 0, 0.4);
            z-index: 9998;
            pointer-events: none;
            animation: blackwall-pulse 0.05s infinite alternate;
        }

        body.blackwall-active {
            animation: blackwall-shake 0.1s infinite;
            background-color: #0a0000 !important;
        }
        body.blackwall-active .scanlines {
            background: linear-gradient(rgba(255, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.2), rgba(0, 0, 0, 0.05), rgba(255, 0, 0, 0.2));
        }
        body.blackwall-active .terminal-container {
            border-color: #ff0000;
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.6);
        }
        body.blackwall-active .terminal-header {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff0000;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }
        body.blackwall-active #code-editor, body.blackwall-active #terminal-output {
            color: #ff2a2a;
            border-color: #ff0000;
            text-shadow: 0 0 5px rgba(255,0,0,0.5);
            box-shadow: inset 0 0 30px rgba(255,0,0,0.1);
        }
        body.blackwall-active #code-editor::-webkit-scrollbar-thumb, body.blackwall-active #terminal-output::-webkit-scrollbar-thumb {
            background: #ff0000;
        }

        @keyframes blackwall-pulse {
            0% { opacity: 0.7; transform: scaleY(1); }
            100% { opacity: 1; transform: scaleY(3.5); }
        }
        @keyframes blackwall-shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, -1px) rotate(-1deg); }
            40% { transform: translate(-1px, 2px) rotate(1deg); }
            60% { transform: translate(2px, -2px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, 2px) rotate(-1deg); }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="blackwall-overlay" class="blackwall-overlay"></div>
    
    <div class="terminal-container">
        <div class="terminal-header">
            <span>⬢ ICE_BREAKER_COMPILER_V1.6</span>
            <span>NODE: LOCALHOST</span>
        </div>
        
        <div class="editor-area">
            <textarea id="code-editor" spellcheck="false" placeholder="// INIT NETRUNNER PROTOCOL&#10;// INPUT CUSTOM SYNTAX..." onkeydown="handleEditorEnter(event)"></textarea>
            
            <div id="terminal-output">
                <span style="color: #33ff33;">> SYSTEM READY.</span><br>> AWAITING PROTOCOL EXECUTION...
            </div>

            <div class="terminal-controls">
                <button class="action-btn return-btn" onclick="window.location.href='index.html'">[ ABORT / RETURN TO OS ]</button>
                
                <!-- DATASHARD MOUNT PORT -->
                <button class="action-btn return-btn" style="border-color: #ffcc00; color: #ffcc00;" onclick="document.getElementById('shard-port').click()">[ MOUNT DATASHARD ]</button>
                <input type="file" id="shard-port" style="display: none;" accept=".txt" onchange="readDatashard(event)">

                <button class="action-btn exec-btn" onclick="compileCode()">[ EXECUTE PROTOCOL ]</button>
            </div>
        </div>

        <!-- Target Modal (Multi-use for Money & Blackwall) -->
        <div id="target-modal" class="target-modal" style="display: none;">
            <span id="target-modal-title" style="color: #33ff33; font-weight: bold; font-family: monospace;">[ ENTER TARGET ALIAS ]</span>
            <input type="text" id="target-input" onkeydown="handleTargetEnter(event)" style="background: transparent; border: 1px solid #33ff33; color: #33ff33; padding: 10px; font-family: monospace; outline: none;" autocomplete="off">
            <button class="action-btn exec-btn" id="target-lock-btn" onclick="lockTarget()">LOCK TARGET</button>
        </div>

        <!-- Spoof Modal (Message Injection) -->
        <div id="spoof-modal" class="target-modal spoof-theme" style="display: none;">
            <span style="color: #ff2a2a; font-weight: bold; font-family: monospace; margin-bottom: 5px;">[ OVERRIDE COMMS NETWORK ]</span>
            <input type="text" id="spoof-sender" placeholder="SPOOF SENDER (e.g., boss@cybernet.com)" class="spoof-input" autocomplete="off">
            <input type="text" id="spoof-receiver" placeholder="TARGET RECEIVER (e.g., v@cybernet.com)" class="spoof-input" autocomplete="off">
            <textarea id="spoof-message" placeholder="ENTER FORGED DATASTREAM..." class="spoof-input spoof-textarea"></textarea>
            <button class="action-btn spoof-btn" onclick="lockSpoof()">ENCODE PAYLOAD</button>
        </div>
    </div>

    <!-- FIREBASE DB CONNECTION -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrLr7l2F89qzqV3Xmn1P6NLJ6nl_HSOPU",
            authDomain: "keystone-cybernet.firebaseapp.com",
            databaseURL: "https://keystone-cybernet-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "keystone-cybernet",
            storageBucket: "keystone-cybernet.firebasestorage.app",
            messagingSenderId: "510405488684",
            appId: "1:510405488684:web:db3b484dbfa013e665a189"
        };
        
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) {
            console.error("Firebase init bypass:", e);
        }
        
        const myEmail = localStorage.getItem('cybernetEmail') || "unknown@cybernet.com";

        // Cooldown Tracker
        let lastHackTime = 0;
        const HACK_COOLDOWN_MS = 60000; 

        // Global Trackers
        let activeHackMode = null; 
        
        let pendingHackAmount = 0;
        let pendingTarget = "";

        let pendingSpoofSender = "";
        let pendingSpoofReceiver = "";
        let pendingSpoofMessage = "";

        function logToTerminal(text) {
            const out = document.getElementById('terminal-output');
            out.innerHTML += `<br>${text}`;
            out.scrollTop = out.scrollHeight;
        }

        // --- DATASHARD READER ---
        function readDatashard(event) {
            const file = event.target.files[0];
            if (!file) return;

            logToTerminal(`> <span style="color: #ffcc00;">[SYSTEM] DETECTING EXTERNAL HARDWARE...</span>`);
            const reader = new FileReader();
            
            reader.onload = function(e) {
                document.getElementById('code-editor').value = e.target.result;
                setTimeout(() => {
                    logToTerminal(`> <span style="color: #33ff33;">[DATASHARD MOUNTED: ${file.name.toUpperCase()}]</span> Ready for execution.`);
                }, 500);
                document.getElementById('shard-port').value = '';
            };
            
            reader.onerror = function() {
                logToTerminal(`> <span style="color: #ff2a2a;">[ERR] DATASHARD CORRUPTED OR UNREADABLE.</span>`);
            };
            reader.readAsText(file);
        }

        function handleEditorEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); 
                const editor = document.getElementById('code-editor');
                editor.value += '\n';
                editor.scrollTop = editor.scrollHeight;
                compileCode(); 
            }
        }

        function handleTargetEnter(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                lockTarget();
            }
        }

        function compileCode() {
            const code = document.getElementById('code-editor').value;
            
            // Syntax Matchers
            const extractRegex = /milli?tech:extract-eurodollars\s*[-]*\s*\(?(\d+)\)?/i;
            const spoofRegex = /milli?tech:send-usermessage/i;
            const blackwallRegex = /blackwall:\s*drain-ed/i; // NEW: Blackwall Syntax
            const executeRegex = /(milli?tech|blackwall):execute-recent/i;

            const extractMatch = code.match(extractRegex);
            const spoofMatch = code.match(spoofRegex);
            const blackwallMatch = code.match(blackwallRegex);
            const executeMatch = code.match(executeRegex);

            // Phase 1a: Money Hack Initiated
            if (extractMatch && activeHackMode === null) {
                const requestedAmount = parseInt(extractMatch[1]);
                if (requestedAmount > 500) {
                    logToTerminal("> <span style='color: #ff2a2a;'>[ERR] CAPACITY OVERLOAD. MAX EXTRACTION LIMIT IS 500 €$.</span>");
                    return; 
                }
                activeHackMode = 'money';
                pendingHackAmount = requestedAmount;
                setTargetModalStyle('green', '[ ENTER TARGET ALIAS TO EXTRACT FROM ]');
                document.getElementById('target-modal').style.display = 'flex';
                document.getElementById('target-input').focus();
            } 
            
            // Phase 1b: Blackwall Drain Initiated
            else if (blackwallMatch && activeHackMode === null) {
                activeHackMode = 'blackwall';
                // Turn the target modal aggressive red
                setTargetModalStyle('red', '[ ENTER TARGET ALIAS TO PURGE ]');
                document.getElementById('target-modal').style.display = 'flex';
                document.getElementById('target-input').focus();
            }
            
            // Phase 1c: Message Spoof Initiated
            else if (spoofMatch && activeHackMode === null) {
                activeHackMode = 'message';
                document.getElementById('spoof-modal').style.display = 'flex';
                document.getElementById('spoof-sender').focus();
            }
            
            // Phase 2: Execute command detected
            else if (executeMatch) {
                if ((activeHackMode === 'money' || activeHackMode === 'blackwall') && pendingTarget !== "") {
                    runHackAnimation();
                } else if (activeHackMode === 'message' && pendingSpoofReceiver !== "") {
                    runHackAnimation();
                } else {
                    logToTerminal("> <span style='color: #ff2a2a;'>[ERR] PENDING HACK INCOMPLETE. COMPLETE PARAMS FIRST.</span>");
                }
            } 
            else if (!extractMatch && !spoofMatch && !blackwallMatch && code.trim() !== "") {
                logToTerminal("> <span style='color: #ff2a2a;'>[ERR] INVALID SYNTAX DETECTED.</span>");
            }
        }

        // Helper to colorize the Target Modal dynamically
        function setTargetModalStyle(color, titleText) {
            const modal = document.getElementById('target-modal');
            const input = document.getElementById('target-input');
            const btn = document.getElementById('target-lock-btn');
            const title = document.getElementById('target-modal-title');
            
            title.innerText = titleText;
            if (color === 'red') {
                modal.style.borderColor = '#ff0000';
                modal.style.boxShadow = '0 0 30px rgba(255, 0, 0, 0.5)';
                input.style.borderColor = '#ff0000';
                input.style.color = '#ff0000';
                title.style.color = '#ff0000';
                btn.style.color = '#000';
                btn.style.background = '#ff0000';
                btn.style.borderColor = '#ff0000';
            } else {
                modal.style.borderColor = '#33ff33';
                modal.style.boxShadow = '0 0 30px rgba(51, 255, 51, 0.5)';
                input.style.borderColor = '#33ff33';
                input.style.color = '#33ff33';
                title.style.color = '#33ff33';
                btn.style.color = '#33ff33';
                btn.style.background = 'rgba(51, 255, 51, 0.1)';
                btn.style.borderColor = '#33ff33';
            }
        }

        function lockTarget() {
            let target = document.getElementById('target-input').value.trim().toLowerCase();
            if (target !== '' && !target.includes('@')) target += '@cybernet.com';
            
            if(target !== '') {
                pendingTarget = target;
                document.getElementById('target-modal').style.display = 'none';
                
                if (activeHackMode === 'blackwall') {
                    logToTerminal(`> <span style="color: #ff0000; text-shadow: 0 0 5px #ff0000;">TARGET MARKED FOR PURGE: ${pendingTarget}.</span> Awaiting Execution Protocol...`);
                } else {
                    logToTerminal(`> <span style="color: #33ff33;">TARGET LOCKED: ${pendingTarget}.</span> Awaiting Execution Protocol...`);
                }
                
                document.getElementById('target-input').value = ''; 
                document.getElementById('code-editor').focus();
            }
        }

        function lockSpoof() {
            let sender = document.getElementById('spoof-sender').value.trim().toLowerCase();
            let receiver = document.getElementById('spoof-receiver').value.trim().toLowerCase();
            let message = document.getElementById('spoof-message').value.trim();

            if (sender !== '' && !sender.includes('@')) sender += '@cybernet.com';
            if (receiver !== '' && !receiver.includes('@')) receiver += '@cybernet.com';

            if (sender !== '' && receiver !== '' && message !== '') {
                pendingSpoofSender = sender;
                pendingSpoofReceiver = receiver;
                pendingSpoofMessage = message;

                document.getElementById('spoof-modal').style.display = 'none';
                logToTerminal(`> <span style="color: #ff2a2a;">PAYLOAD ENCODED: SPOOFING TO ${receiver}.</span> Awaiting Execution Protocol...`);
                
                document.getElementById('spoof-sender').value = '';
                document.getElementById('spoof-receiver').value = '';
                document.getElementById('spoof-message').value = '';

                document.getElementById('code-editor').focus();
            } else {
                alert("[SYSTEM ERR] All fields required to generate payload.");
            }
        }

        async function runHackAnimation() {
            const timeSinceLastHack = Date.now() - lastHackTime;
            if (timeSinceLastHack < HACK_COOLDOWN_MS) {
                const remainingSeconds = Math.ceil((HACK_COOLDOWN_MS - timeSinceLastHack) / 1000);
                logToTerminal(`> <span style='color: #ffcc00;'>[WARN] CYBERDECK OVERHEATING. THERMAL COOLDOWN: ${remainingSeconds}s.</span>`);
                return;
            }

            const btn = document.querySelector('.exec-btn');
            btn.disabled = true;
            btn.innerText = "[ BREACHING... ]";
            lastHackTime = Date.now();

            // TRIGGER INTENSE BLACKWALL VISUALS
            if (activeHackMode === 'blackwall') {
                document.body.classList.add('blackwall-active');
                document.getElementById('blackwall-overlay').style.display = 'block';
                logToTerminal(`> <span style="color:#ff0000; font-weight:bold; font-size: 1.2rem;">INITIATING BLACKWALL PROTOCOL...</span>`);
            }

            // Visual hacking sequence
            for(let i=0; i<15; i++) {
                await new Promise(r => setTimeout(r, 100));
                
                if (activeHackMode === 'blackwall') {
                    logToTerminal(`> PIERCING ICE 0x${Math.floor(Math.random()*99999)}... <span style="color:#ff0000; text-shadow: 0 0 5px #ff0000;">CORRUPTED.</span>`);
                } else if (activeHackMode === 'money') {
                    logToTerminal(`> OVERRIDING SUBNET 0x${Math.floor(Math.random()*99999)}... <span style="color:#33ff33;">bypassed.</span>`);
                } else {
                    logToTerminal(`> INJECTING PACKET 0x${Math.floor(Math.random()*99999)}... <span style="color:#ff2a2a;">forced.</span>`);
                }
                
                if(i % 3 === 0) spawnGhostWindow();
            }

            // --- RNG SUCCESS RATES ---
            // Blackwall = 40% success. Standard Hacks = 87% success.
            const successRate = activeHackMode === 'blackwall' ? 0.40 : 0.87;
            const successRoll = Math.random(); 

            if (successRoll > successRate) {
                // Hack failed!
                if (activeHackMode === 'blackwall') {
                    logToTerminal(`> <span style='color: #ff0000; font-weight: bold; font-size: 1.2rem; text-shadow: 0 0 10px #ff0000;'>[FATAL ERR] ROGUE AI DETECTED. CONNECTION SEVERED TO PREVENT LETHAL FEEDBACK.</span>`);
                } else {
                    logToTerminal(`> <span style='color: #ff2a2a; font-weight: bold;'>[CRITICAL ERR] NETWATCH TRACE DETECTED. CONNECTION SEVERED.</span>`);
                }
                resetHackState();
                btn.disabled = false;
                btn.innerText = "[ EXECUTE PROTOCOL ]";
                return; 
            }

            // FIREBASE EXECUTION
            try {
                if (activeHackMode === 'blackwall') {
                    // RUN BLACKWALL DRAIN
                    const targetRef = db.collection('users').doc(pendingTarget);
                    await db.runTransaction(async (transaction) => {
                        // Set balance to absolute 0
                        transaction.set(targetRef, { 
                            balance: 0,
                            wasHacked: Date.now() 
                        }, { merge: true });
                    });
                    logToTerminal(`<br><span style="color: #ff0000; font-weight: bold; font-size: 1.4rem; text-shadow: 0 0 15px #ff0000;">> BLACKWALL ENGAGED. ALL FUNDS DESTROYED FOR ${pendingTarget}</span>`);

                } else if (activeHackMode === 'money') {
                    // RUN NORMAL MONEY HACK
                    const senderRef = db.collection('users').doc(pendingTarget);
                    const receiverRef = db.collection('users').doc(myEmail);

                    await db.runTransaction(async (transaction) => {
                        const senderDoc = await transaction.get(senderRef);
                        const receiverDoc = await transaction.get(receiverRef);

                        let senderBalance = senderDoc.exists ? senderDoc.data().balance : 1000;
                        let receiverBalance = receiverDoc.exists ? receiverDoc.data().balance : 1000;

                        transaction.set(senderRef, { 
                            balance: senderBalance - pendingHackAmount,
                            wasHacked: Date.now() 
                        }, { merge: true });
                        
                        transaction.set(receiverRef, { 
                            balance: receiverBalance + pendingHackAmount 
                        }, { merge: true });
                    });
                    logToTerminal(`<br><span style="color: #ffcc00; font-weight: bold; font-size: 1.2rem;">> extracted ${pendingHackAmount} €$ from ${pendingTarget}</span>`);

                } else if (activeHackMode === 'message') {
                    // RUN SPOOF
                    await db.collection("emails").add({
                        from: pendingSpoofSender,
                        to: pendingSpoofReceiver,
                        participants: [pendingSpoofSender, pendingSpoofReceiver],
                        subject: "CLASSIFIED DATASHARD",
                        body: pendingSpoofMessage,
                        timestamp: Date.now(),
                        read: false,
                        attachedFunds: 0
                    });
                    logToTerminal(`<br><span style="color: #ff2a2a; font-weight: bold; font-size: 1.2rem;">> SPOOF SUCCESSFUL. COMMS INJECTED TO ${pendingSpoofReceiver}</span>`);
                }

                resetHackState();
            } catch (error) {
                console.error(error);
                logToTerminal("> <span style='color: #ff2a2a;'>[ERR] NETWATCH BLOCKED THE PAYLOAD.</span>");
                resetHackState();
            }

            btn.disabled = false;
            btn.innerText = "[ EXECUTE PROTOCOL ]";
            document.getElementById('code-editor').focus();
        }

        function resetHackState() {
            activeHackMode = null;
            pendingHackAmount = 0;
            pendingTarget = "";
            pendingSpoofSender = "";
            pendingSpoofReceiver = "";
            pendingSpoofMessage = "";
            document.getElementById('code-editor').value = ""; 
            
            // Turn off Blackwall visuals
            document.body.classList.remove('blackwall-active');
            document.getElementById('blackwall-overlay').style.display = 'none';
        }

        function spawnGhostWindow() {
            let win = document.createElement('div');
            win.className = 'ghost-window';
            win.style.top = (5 + Math.random() * 80) + '%';
            win.style.left = (5 + Math.random() * 80) + '%';
            
            const randomScale = (0.5 + Math.random() * 2).toFixed(2);
            win.style.transform = `scale(${randomScale})`;
            win.style.zIndex = Math.floor(9000 + Math.random() * 1000);

            // Change colors based on hack type
            if (activeHackMode === 'blackwall') {
                win.style.color = '#ff0000';
                win.style.borderColor = '#ff0000';
                win.style.boxShadow = '0 0 20px #ff0000';
                win.style.background = 'rgba(30,0,0,0.9)';
                win.innerHTML = `> FATAL ERROR<br>> CORRUPTING SECTOR: ${Math.random().toString(36).substring(2, 10)}<br>> [PURGE IMMINENT]`;
            } else if (activeHackMode === 'message') {
                win.style.color = '#ff2a2a';
