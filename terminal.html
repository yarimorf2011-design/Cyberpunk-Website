<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE BREAKER - Terminal</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Custom Terminal Overrides - GREEN THEME */
        .terminal-container {
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            border: 2px solid #33ff33;
            background: rgba(0, 10, 0, 0.85);
            box-shadow: 0 0 30px rgba(51, 255, 51, 0.2);
            position: relative;
            z-index: 10;
        }

        .terminal-header {
            background: rgba(51, 255, 51, 0.15);
            color: #33ff33;
            padding: 15px 20px;
            border-bottom: 2px solid #33ff33;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
        }

        /* FLEXBOX FIX FOR OVERFLOW */
        .editor-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow: hidden; /* Keeps everything locked inside */
        }

        #code-editor {
            flex-grow: 3; /* Takes up 3 parts of the space */
            min-height: 0; /* Prevents overflow pushing the box out */
            background: #010501;
            border: 1px solid rgba(51, 255, 51, 0.3);
            color: #33ff33; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            padding: 20px;
            outline: none;
            resize: none;
            line-height: 1.5;
        }

        #code-editor:focus {
            border-color: #33ff33;
            box-shadow: inset 0 0 20px rgba(51, 255, 51, 0.1);
        }

        /* Terminal Output Log */
        #terminal-output {
            flex-grow: 2; /* Takes up 2 parts of the space */
            min-height: 0; /* Forces scrollbar instead of breaking borders */
            background: #000000;
            border: 1px solid rgba(51, 255, 51, 0.3);
            color: #ffffff; /* White text for console logs */
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            padding: 15px;
            overflow-y: auto;
            line-height: 1.4;
        }

        /* Custom green scrollbars */
        #code-editor::-webkit-scrollbar, #terminal-output::-webkit-scrollbar { width: 8px; }
        #code-editor::-webkit-scrollbar-track, #terminal-output::-webkit-scrollbar-track { background: transparent; }
        #code-editor::-webkit-scrollbar-thumb, #terminal-output::-webkit-scrollbar-thumb { background: #33ff33; }

        .terminal-controls {
            display: flex;
            justify-content: space-between;
            flex-shrink: 0; /* Prevents buttons from squishing */
        }

        .action-btn {
            padding: 10px 30px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.2s;
        }

        .return-btn { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); }
        .return-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

        .exec-btn { background: rgba(51, 255, 51, 0.1); border: 1px solid #33ff33; color: #33ff33; }
        .exec-btn:hover { background: #33ff33; color: #000; box-shadow: 0 0 15px #33ff33; }

        /* Hacking Target Modal */
        .target-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #050a05; border: 2px solid #33ff33; padding: 20px;
            box-shadow: 0 0 30px rgba(51, 255, 51, 0.5); z-index: 100;
            display: flex; flex-direction: column; gap: 15px; text-align: center;
        }
        
        .ghost-window {
            position: fixed; border: 1px solid #33ff33; background: rgba(0,20,0,0.9);
            color: #33ff33; font-family: monospace; padding: 10px; z-index: 9999;
            box-shadow: 0 0 15px #33ff33; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="terminal-container">
        <div class="terminal-header">
            <span>⬢ ICE_BREAKER_COMPILER_V1.2</span>
            <span>NODE: LOCALHOST</span>
        </div>
        
        <div class="editor-area">
            <!-- Input Area (Added keydown listener for ENTER key) -->
            <textarea id="code-editor" spellcheck="false" placeholder="// INIT NETRUNNER PROTOCOL&#10;// INPUT CUSTOM SYNTAX..." onkeydown="handleEditorEnter(event)"></textarea>
            
            <!-- Output Log Area -->
            <div id="terminal-output">
                <span style="color: #33ff33;">> SYSTEM READY.</span><br>> AWAITING PROTOCOL EXECUTION...
            </div>

            <div class="terminal-controls">
                <button class="action-btn return-btn" onclick="window.location.href='index.html'">[ ABORT / RETURN TO OS ]</button>
                <button class="action-btn exec-btn" onclick="compileCode()">[ EXECUTE PROTOCOL ]</button>
            </div>
        </div>

        <!-- Hidden Target Modal (Added keydown listener for ENTER key) -->
        <div id="target-modal" class="target-modal" style="display: none;">
            <span style="color: #33ff33; font-weight: bold; font-family: monospace;">[ ENTER TARGET ALIAS TO EXTRACT FROM ]</span>
            <input type="text" id="target-input" onkeydown="handleTargetEnter(event)" style="background: transparent; border: 1px solid #33ff33; color: #33ff33; padding: 10px; font-family: monospace; outline: none;" autocomplete="off">
            <button class="action-btn exec-btn" onclick="lockTarget()">LOCK TARGET</button>
        </div>
    </div>

    <!-- FIREBASE DB CONNECTION -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Init Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCrLr7l2F89qzqV3Xmn1P6NLJ6nl_HSOPU",
            authDomain: "keystone-cybernet.firebaseapp.com",
            databaseURL: "https://keystone-cybernet-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "keystone-cybernet",
            storageBucket: "keystone-cybernet.firebasestorage.app",
            messagingSenderId: "510405488684",
            appId: "1:510405488684:web:db3b484dbfa013e665a189"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const myEmail = localStorage.getItem('cybernetEmail');

        let pendingHackAmount = 0;
        let pendingTarget = "";

        function logToTerminal(text) {
            const out = document.getElementById('terminal-output');
            out.innerHTML += `<br>${text}`;
            out.scrollTop = out.scrollHeight;
        }

       // --- KEYBOARD LISTENERS FIX ---
       function handleEditorEnter(event) {
            // Allows the Enter key to move to the next line natively before executing
            if (event.key === 'Enter' && !event.shiftKey) {
                setTimeout(() => {
                    compileCode();
                }, 10);
            }
        }

        async function runHackAnimation() {
            const btn = document.querySelector('.exec-btn');
            btn.disabled = true;
            btn.innerText = "[ BREACHING ICE... ]";

            // The cool visual hacking sequence
            for(let i=0; i<15; i++) {
                await new Promise(r => setTimeout(r, 100));
                logToTerminal(`> OVERRIDING SUBNET 0x${Math.floor(Math.random()*99999)}... <span style="color:#33ff33;">bypassed.</span>`);
                
                // Spawn fake ghost windows randomly
                if(i % 3 === 0) spawnGhostWindow();
            }

            // Transfer the funds via Firebase Transaction
            try {
                const senderRef = db.collection('users').doc(pendingTarget);
                const receiverRef = db.collection('users').doc(myEmail);

                await db.runTransaction(async (transaction) => {
                    const senderDoc = await transaction.get(senderRef);
                    const receiverDoc = await transaction.get(receiverRef);

                    let senderBalance = senderDoc.exists ? senderDoc.data().balance : 1000;
                    let receiverBalance = receiverDoc.exists ? receiverDoc.data().balance : 1000;

                    // Netrunners steal it and flag the victim's OS with a hack timestamp!
                    transaction.set(senderRef, { 
                        balance: senderBalance - pendingHackAmount,
                        wasHacked: Date.now() // <--- THIS TRIGGERS THE RED ALARM
                    }, { merge: true });
                    
                    transaction.set(receiverRef, { 
                        balance: receiverBalance + pendingHackAmount 
                    }, { merge: true });
                });

                // Final Yellow Success Text
                logToTerminal(`<br><span style="color: #ffcc00; font-weight: bold; font-size: 1.2rem;">> extracted ${pendingHackAmount} €$ from ${pendingTarget}</span>`);
                
                // Clear pending hack
                pendingHackAmount = 0;
                pendingTarget = "";
                document.getElementById('code-editor').value = ""; // Auto-clear code window

            } catch (error) {
                console.error(error);
                logToTerminal("> <span style='color: #ff2a2a;'>[ERR] NETWATCH BLOCKED THE TRANSFER.</span>");
            }

            btn.disabled = false;
            btn.innerText = "[ EXECUTE PROTOCOL ]";
            document.getElementById('code-editor').focus();
        }

        // --- RANDOM SIZED GHOST WINDOWS ---
        function spawnGhostWindow() {
            let win = document.createElement('div');
            win.className = 'ghost-window';
            win.style.top = (5 + Math.random() * 80) + '%';
            win.style.left = (5 + Math.random() * 80) + '%';
            
            // Randomize Size (between 0.5x and 2.5x scale)
            const randomScale = (0.5 + Math.random() * 2).toFixed(2);
            win.style.transform = `scale(${randomScale})`;
            win.style.zIndex = Math.floor(9000 + Math.random() * 1000);

            win.innerHTML = `> DATAMINE ACTIVE<br>> DECRYPTING: ${Math.random().toString(36).substring(2, 10)}<br>> [ACCESS GRANTED]`;
            document.body.appendChild(win);
            setTimeout(() => win.remove(), 800 + Math.random() * 1000);
        }
    </script>
</body>
</html>
